name: CI (Linux, macOS, Windows)

# K2-01: every Koda suite on every push to main and every pull request, on real Linux, macOS and Windows.
# fail-fast is off and each suite is its own step, so the result of every suite on every OS is visible in GitHub.
# Free: the repository is public and only GitHub-hosted standard runners are used.
#
# Suites: desktop-daemon, desktop-harness (agent hooks), desktop-pi (Pi extension), desktop-sound, the island's
# Node checks (apps/desktop-tauri/test-node) and the island's Rust tests (cargo test).
# A skip is allowed only where a test names its OS mechanism and its twin runs on the other OS (see each suite).
# Also on every branch push (except preview/**, which only triggers preview-windows.yml), so a feature branch is proven on
# the 3 OS before its PR.
# workflow_dispatch only works once this file is on the default branch.
on:
  push:
    branches-ignore: ['preview/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned on purpose: a new Pi or Playwright release must not silently change what CI tests.
  PI_VERSION: '1.4.0'
  PLAYWRIGHT_VERSION: '1.62.1'
  SHERPA_VERSION: '1.13.8'

jobs:
  node-suites:
    name: Node suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75 # K2-01b: the daemon now really boots on Windows; per-file cap in desktop-daemon npm test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the real Pi (real-Pi tests must run, never skip)
        shell: bash
        run: |
          # Retried ONLY on registry/network errors; any other npm failure fails at once.
          for attempt in 1 2 3 4 5 6; do
            if npm i -g "@earendil-works/pi-coding-agent@$PI_VERSION" 2>&1 | tee "$RUNNER_TEMP/npm-pi.log"; then break; fi
            if ! grep -qE 'npm error code (ETARGET|ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|E5[0-9][0-9]|ESOCKETTIMEDOUT|EPIPE)|network (timeout|socket)' "$RUNNER_TEMP/npm-pi.log"; then
              echo "npm failed with a non-network error: not retrying"; exit 1
            fi
            if [ "$attempt" = 6 ]; then echo "npm install of Pi kept failing on network errors"; exit 1; fi
            echo "registry/network error on attempt $attempt; retrying in $((attempt * 20))s"; sleep $((attempt * 20))
          done
          ROOT="$(npm root -g)/@earendil-works/pi-coding-agent"
          test -f "$ROOT/dist/core/extensions/loader.js"
          echo "PI_CODING_AGENT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Install the real engine (Gentle Shell, pinned by Koda's own runtime lockfile; the offline proof must run, never skip)
        shell: bash
        run: |
          # K2-05 T2: the daemon's engine is Koda's bundled Gentle Shell, so CI proves the real engine
          # with the exact pins the shipped runtime carries (gentle-pi 4.3.0 + Pi 1.4.0 and every peer,
          # sha512-pinned in packaging/runtime/package-lock.json). npm ci installs exactly that closure
          # (install scripts not run, as in the runtime build itself); GENTLE_PI_ROOT points the
          # real-engine tests at it and ABITO_REQUIRE_GENTLE=1 (below) makes absence fail the job.
          DIR="$RUNNER_TEMP/gentle-engine"
          mkdir -p "$DIR"
          cp apps/desktop-tauri/packaging/runtime/package.json apps/desktop-tauri/packaging/runtime/package-lock.json "$DIR/"
          # Retried ONLY on registry/network errors; any other npm failure fails at once (same policy as the Pi install above).
          for attempt in 1 2 3 4 5 6; do
            if (cd "$DIR" && npm ci --ignore-scripts --omit=dev --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/npm-gentle.log"); then break; fi
            if ! grep -qE 'npm error code (ETARGET|ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|E5[0-9][0-9]|ESOCKETTIMEDOUT|EPIPE)|network (timeout|socket)' \
              "$RUNNER_TEMP/npm-gentle.log"; then
              echo "npm failed with a non-network error: not retrying"; exit 1
            fi
            if [ "$attempt" = 6 ]; then echo "npm install of the engine kept failing on network errors"; exit 1; fi
            echo "registry/network error on attempt $attempt; retrying in $((attempt * 20))s"; sleep $((attempt * 20))
          done
          ROOT="$DIR/node_modules/gentle-pi"
          test -f "$ROOT/bin/gentle-shell.mjs"
          test -d "$DIR/node_modules/@earendil-works/pi-coding-agent"
          test "$(ROOT="$ROOT" node -p "require(require('path').join(process.env.ROOT, 'package.json')).version")" = 4.3.0
          echo "GENTLE_PI_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Windows install layout for the harness suite (real ACL helper + manifest)
        if: runner.os == 'Windows'
        working-directory: apps/desktop-tauri
        shell: bash
        run: |
          # The checkout is laid out like the install, so the installer tests run the real Windows path: the native helper,
          # hash-checked against a manifest written by the same generator the installer build uses.
          cargo build --locked --bin abito-private-session
          cp target/debug/abito-private-session.exe ../abito-private-session.exe
          node packaging/windows/install-manifest.cjs --dist ../
          echo "ABITO_TEST_HELPER=$(cd .. && pwd -W)/abito-private-session.exe" >> "$GITHUB_ENV"
      - name: desktop-daemon
        if: ${{ !cancelled() }}
        working-directory: apps/desktop-daemon
        shell: bash
        env:
          ABITO_REQUIRE_PI: '1'
          ABITO_REQUIRE_GENTLE: '1'
        run: npm test
      - name: desktop-harness (agent hooks)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop-harness
        shell: bash
        run: npm test
      - name: desktop-pi (Pi extension)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop-pi
        shell: bash
        run: |
          node --test --test-reporter=tap test/*.test.cjs 2>&1 | tee "$RUNNER_TEMP/pi.log"
          test "${PIPESTATUS[0]}" -eq 0
          # Allowed skips, by name only: the Windows-only twins on Linux/macOS and the live Unix-pid probe on Windows.
          skipped="$(grep -E '^[[:space:]]*(ok|not ok) [0-9]+ - .*# SKIP' "$RUNNER_TEMP/pi.log" || true)"
          unexpected="$(printf '%s\n' "$skipped" | grep -v '^$' | grep -v -E 'Windows twin|a live process writing an island-like endpoint.json' || true)"
          echo "skips: ${skipped:-none}"
          if [ -n "$unexpected" ]; then echo "UNEXPECTED SKIP:"; echo "$unexpected"; exit 1; fi
      - name: desktop-sound
        if: ${{ !cancelled() }}
        working-directory: apps/desktop-sound
        shell: bash
        run: npm test

  island-checks:
    name: Island Node checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pinned esbuild 0.28.2 (the coucou build check needs it; never downloaded by the build itself)
        shell: bash
        run: |
          npm i -g esbuild@0.28.2
          ROOT="$(npm root -g)"
          # The NATIVE binary of this OS (@esbuild/<platform>-<arch>), never the bin/esbuild JS shim: Windows cannot
          # execute the shim directly (K2-01b). The resolver only looks at what npm just installed.
          BIN="$(node "$GITHUB_WORKSPACE/apps/desktop-tauri/scripts/esbuild-native.cjs" "$ROOT")"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$(cygpath -w "$BIN")"; fi
          test "$("$BIN" --version)" = 0.28.2
          echo "ESBUILD_BINARY_PATH=$BIN" >> "$GITHUB_ENV"
      - name: Install pinned Playwright and its Chromium (the browser checks need it)
        shell: bash
        run: |
          npm i -g "playwright@$PLAYWRIGHT_VERSION"
          ROOT="$(npm root -g)"
          if [ "$RUNNER_OS" = Linux ]; then npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium
          else npx --yes "playwright@$PLAYWRIGHT_VERSION" install chromium; fi
          echo "PLAYWRIGHT_PATH=$ROOT/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$ROOT" >> "$GITHUB_ENV"
      - name: apps/desktop-tauri/test-node checks (with a shared headless Chromium on 127.0.0.1:9222)
        shell: bash
        run: |
          # notification-card-shared-browser-check ATTACHES over CDP and never launches a browser, like on a dev machine.
          CHROME="$(node -p "require(process.env.PLAYWRIGHT_PATH).chromium.executablePath()")"
          "$CHROME" --headless=new --no-sandbox --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/shared-chrome" about:blank > "$RUNNER_TEMP/shared-chrome.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9222/json/version > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:9222/json/version
          node run-node-checks.cjs

  rust:
    name: Island Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop-tauri
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pinned esbuild 0.28.2 (the coucou build check needs it; never downloaded by the build itself)
        shell: bash
        run: |
          npm i -g esbuild@0.28.2
          ROOT="$(npm root -g)"
          # The NATIVE binary of this OS (@esbuild/<platform>-<arch>), never the bin/esbuild JS shim: Windows cannot
          # execute the shim directly (K2-01b). The resolver only looks at what npm just installed.
          BIN="$(node "$GITHUB_WORKSPACE/apps/desktop-tauri/scripts/esbuild-native.cjs" "$ROOT")"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$(cygpath -w "$BIN")"; fi
          test "$("$BIN" --version)" = 0.28.2
          echo "ESBUILD_BINARY_PATH=$BIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri
          cache-on-failure: true
      - name: Linux system libraries (Tauri, tray, audio, keyring) and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libpulse-dev libasound2-dev libdbus-1-dev xvfb dbus-x11
      - name: Fetch pinned sherpa-onnx static libs (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          A="sherpa-onnx-v${SHERPA_VERSION}-linux-x64-static-lib.tar.bz2"
          curl -fsSL -o "$RUNNER_TEMP/$A" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/$A"
          echo "e1fdc5b67530e15741ef897fa5ffff297056f3bf0c6d829a27af9225a4c4b5a6  $RUNNER_TEMP/$A" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/$A" -C "$RUNNER_TEMP"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/sherpa-onnx-v${SHERPA_VERSION}-linux-x64-static-lib/lib" >> "$GITHUB_ENV"
      - name: Fetch pinned sherpa-onnx static libs (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          A="sherpa-onnx-v${SHERPA_VERSION}-osx-arm64-static-lib.tar.bz2"
          curl -fsSL -o "$RUNNER_TEMP/$A" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/$A"
          echo "9091bf160dc7fdacedbc906b212badf53c2993f4e5277a0e03998e96c31d60da  $RUNNER_TEMP/$A" | shasum -a 256 -c -
          tar -xjf "$RUNNER_TEMP/$A" -C "$RUNNER_TEMP"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/sherpa-onnx-v${SHERPA_VERSION}-osx-arm64-static-lib/lib" >> "$GITHUB_ENV"
      - name: Fetch pinned sherpa-onnx static libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pin = (Get-Content packaging/windows/sherpa-onnx.sha256).Trim() -split '\s+'
          $archive = Join-Path $env:RUNNER_TEMP $pin[1]
          Invoke-WebRequest "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$env:SHERPA_VERSION/$($pin[1])" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin[0]) { throw 'sherpa archive SHA256 mismatch' }
          tar -xjf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lib = Join-Path $env:RUNNER_TEMP (($pin[1] -replace '\.tar\.bz2$', '') + '/lib')
          if (-not (Test-Path (Join-Path $lib 'sherpa-onnx-c-api.lib'))) { throw 'Pinned sherpa archive lacks sherpa-onnx-c-api.lib' }
          "SHERPA_ONNX_LIB_DIR=$lib" >> $env:GITHUB_ENV
          "SHERPA_ONNX_ARCHIVE_DIR=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: cargo test (Linux, on a virtual display with a session bus)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a cargo test --locked --no-fail-fast
      - name: cargo test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --locked --no-fail-fast
      - name: cargo test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --locked --no-fail-fast
          exit $LASTEXITCODE

  # K2-01a criterion 2: the installer of each OS, installed the way a person installs it, starts, shows the island and
  # its tray, and an agent notice reaches it. What only a person can see (the tray icon, answering a question through
  # the shipped app, Gatekeeper/SmartScreen on first launch) is a registered human gap, printed by each smoke.
  installer-smoke-linux:
    name: Installer smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System libraries, a virtual display, a window manager and a session bus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libpulse-dev libasound2-dev libdbus-1-dev xvfb dbus-x11 \
            openbox x11-utils dbus python3-gi gir1.2-glib-2.0 procps strace
      - name: Fetch pinned sherpa-onnx static libs (Linux)
        run: |
          set -euo pipefail
          A="sherpa-onnx-v${SHERPA_VERSION}-linux-x64-static-lib.tar.bz2"
          curl -fsSL -o "$RUNNER_TEMP/$A" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/$A"
          echo "e1fdc5b67530e15741ef897fa5ffff297056f3bf0c6d829a27af9225a4c4b5a6  $RUNNER_TEMP/$A" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/$A" -C "$RUNNER_TEMP"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/sherpa-onnx-v${SHERPA_VERSION}-linux-x64-static-lib/lib" >> "$GITHUB_ENV"
      - name: Pinned Pi (the app-owned daemon refuses to start without one, as on a user machine)
        run: npm i -g "@earendil-works/pi-coding-agent@$PI_VERSION"
      - name: Bundled runtime archive (pinned Node 22 + Pi 1.4.0, sha256-verified by install.sh)
        working-directory: apps/desktop-tauri
        run: |
          node packaging/runtime/build-runtime.cjs --target linux-x64 --out "$RUNNER_TEMP/koda-runtime" \
            --cache "$RUNNER_TEMP/koda-runtime-cache" --self-check \
            --archive "$RUNNER_TEMP/koda-runtime-linux-x64.tar.gz"
      - name: Warm the cargo registry (build.cjs builds --offline --locked)
        working-directory: apps/desktop-tauri
        run: cargo fetch --locked
      - name: Build, install and smoke the shipped Linux package
        run: |
          sh apps/desktop-tauri/ci/public/smoke-linux.sh --app "$GITHUB_WORKSPACE/apps/desktop-tauri" \
            --work "$RUNNER_TEMP/koda-smoke" --pi "$(command -v pi)" \
            --runtime-archive "$RUNNER_TEMP/koda-runtime-linux-x64.tar.gz"
      - name: "No Node, no Pi: install and run on Koda's own runtime (K2-02 S1, S3; removes the runner's Node)"
        if: ${{ !cancelled() }}
        run: |
          STAGE=$(find "$RUNNER_TEMP/koda-smoke/stage/abito-island" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          sh apps/desktop-tauri/ci/public/smoke-linux-no-node.sh --app "$GITHUB_WORKSPACE/apps/desktop-tauri" \
            --stage "$STAGE" --work "$RUNNER_TEMP/koda-no-node"
      - name: Upload smoke logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-linux
          path: |
            ${{ runner.temp }}/koda-smoke/**/*.log
            ${{ runner.temp }}/koda-no-node/*.log
            ${{ runner.temp }}/koda-no-node/connect.trace
          if-no-files-found: warn

  installer-smoke-macos:
    name: Installer smoke (macos-26)
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/desktop-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned sherpa-onnx static libs (macOS)
        run: |
          set -euo pipefail
          A="sherpa-onnx-v${SHERPA_VERSION}-osx-arm64-static-lib.tar.bz2"
          curl -fsSL -o "$RUNNER_TEMP/$A" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/$A"
          echo "9091bf160dc7fdacedbc906b212badf53c2993f4e5277a0e03998e96c31d60da  $RUNNER_TEMP/$A" | shasum -a 256 -c -
          tar -xjf "$RUNNER_TEMP/$A" -C "$RUNNER_TEMP"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/sherpa-onnx-v${SHERPA_VERSION}-osx-arm64-static-lib/lib" >> "$GITHUB_ENV"
      - name: Koda's own Node + Pi (pinned sha256 + lockfile; K2-02)
        run: |
          node packaging/runtime/build-runtime.cjs --target darwin-arm64 \
            --out "$RUNNER_TEMP/koda-runtime" --cache "$RUNNER_TEMP/koda-runtime-cache" --self-check
      - name: Build .app and .dmg (unsigned, ad-hoc; no Apple account)
        run: |
          npx --yes @tauri-apps/cli@2 build --ci --bundles app,dmg \
            --config "$(node packaging/macos-config.cjs --runtime "$RUNNER_TEMP/koda-runtime")" \
            -- --locked
      - name: Verify bundle seal, Info.plist and the version the app shows
        run: |
          set -euo pipefail
          app=$(ls -d target/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q '^Signature=adhoc' "$RUNNER_TEMP/codesign.txt"
          test -d "$app/Contents/_CodeSignature"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = true
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist" >/dev/null
          want=$(node -p "require('./tauri.conf.json').version")
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$want"
          # K2-02: the bundled Node is a signed Mach-O inside the seal, and the bundled Node + Pi run from the .app.
          rt="$app/Contents/Resources/runtime"
          codesign -dv "$rt/node" 2>&1 | tee "$RUNNER_TEMP/codesign-node.txt"
          grep -q '^Identifier=' "$RUNNER_TEMP/codesign-node.txt"
          want_node="v$(sed -n 's/.*node-v\([0-9.]*\)-darwin-arm64\.tar\.gz$/\1/p' packaging/runtime/node.sha256)"
          test "$(env -i PATH=/usr/bin:/bin "$rt/node" --version)" = "$want_node"
          h=$(mktemp -d)
          test "$(env -i PATH=/usr/bin:/bin HOME="$h" PI_OFFLINE=1 PI_SKIP_VERSION_CHECK=1 PI_TELEMETRY=0 "$rt/pi" --version)" = 1.4.0
      - name: Installed runtime lookup in a release build
        run: cargo test --release --locked --test platform_runtime
      - name: Isolated home with the pinned Pi and a node link
        run: |
          prefix="$RUNNER_TEMP/koda-smoke/home/.npm-global"
          mkdir -p "$prefix/bin"
          chmod 700 "$RUNNER_TEMP/koda-smoke" "$RUNNER_TEMP/koda-smoke/home"
          npm install --global --prefix "$prefix" "@earendil-works/pi-coding-agent@$PI_VERSION"
          ln -s "$(command -v node)" "$prefix/bin/node"
      - name: Install from the .dmg and smoke the installed app
        run: |
          set -euo pipefail
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          python3 ci/public/smoke-macos-installed.py "$dmg" "$RUNNER_TEMP/koda-smoke"
      - name: Broken bundled runtime fails closed with notices still available (installed copy)
        if: ${{ !cancelled() }}
        run: python3 ci/public/smoke-macos.py "$(ls -d "$RUNNER_TEMP"/koda-smoke/Applications/*.app)" "$RUNNER_TEMP/koda-smoke/home"
      - name: "No Node, no Pi: install from the dmg and run on Koda's own runtime (K2-02 S1; removes the runner's Node)"
        if: ${{ !cancelled() }}
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          python3 ci/public/smoke-macos-no-node.py "$dmg" "$RUNNER_TEMP/koda-no-node"
      - name: Upload smoke log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-macos
          path: |
            ${{ runner.temp }}/koda-smoke/*.log
            ${{ runner.temp }}/koda-smoke/home/*.log
            ${{ runner.temp }}/koda-no-node/*.log
          if-no-files-found: warn

  installer-smoke-windows:
    name: Installer smoke (windows-latest)
    # The full Windows installer build + install/hooks/uninstall smoke lives in preview-windows.yml (workflow_call).
    uses: ./.github/workflows/preview-windows.yml
